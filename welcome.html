<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenida</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Playfair Display', serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #fce4ec, #fff5f8);
        overflow: hidden;
        position: relative;
    }

    .welcome-box {
        text-align: center;
        z-index: 1;
        padding: 20px;
    }

    .welcome-title {
        font-family: 'Dancing Script', cursive;
        font-size: clamp(2.2rem, 8vw, 3.5rem);
        color: #4a2040;
        margin-bottom: 0.8rem;
    }

    .welcome-sub {
        font-style: italic;
        color: #7b4f6a;
        margin-bottom: 2.2rem;
        font-size: 1rem;
    }

    .welcome-btn {
        font-family: 'Playfair Display', serif;
        font-size: 1rem;
        font-weight: 700;
        color: white;
        background: #e91e8c;
        border: none;
        border-radius: 999px;
        padding: 0.9rem 2.2rem;
        cursor: pointer;
        box-shadow: 0 8px 30px rgba(233,30,140,0.35);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .welcome-btn:hover {
        transform: translateY(-3px) scale(1.03);
        box-shadow: 0 12px 36px rgba(233,30,140,0.45);
    }

    .welcome-btn:active {
        transform: translateY(0) scale(0.98);
    }

    /* Corazones flotando de fondo, opcional */
    .float-heart {
        position: absolute;
        bottom: -10%;
        color: #f06292;
        opacity: 0;
        animation: floatUp linear infinite;
    }

    @keyframes floatUp {
        0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
        10%  { opacity: 0.5; }
        90%  { opacity: 0.2; }
        100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }
</style>
</head>
<body>

    <div class="welcome-box">
        <div class="welcome-title">Para ti</div>
        <div class="welcome-sub">Tengo algo especial que mostrarte...</div>
        <button class="welcome-btn" onclick="entrar()">Abrir 💌</button>
    </div>

    <script>
        // Corazones decorativos de fondo
        const positions = [5, 15, 28, 40, 55, 68, 80, 92];
        positions.forEach((left, i) => {
            const h = document.createElement('div');
            h.className = 'float-heart';
            h.textContent = '💗';
            h.style.left = left + '%';
            h.style.fontSize = (1.2 + Math.random() * 1.5) + 'rem';
            h.style.animationDuration = (12 + Math.random() * 10) + 's';
            h.style.animationDelay = (i * 1.3) + 's';
            document.body.appendChild(h);
        });

        function entrar() {
            // Cambia "index.html" por el nombre real de tu página principal
            window.location.href = "00-page.html";
        }
    </script>

</body>
</html>
